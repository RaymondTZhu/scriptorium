[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptorium"
version = "0.1.0"
description = "Consent-based handwriting style synthesis and provenance research prototype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
ai = [
    "openai>=1.0.0"
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "ipykernel>=6.29.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "packages*",
    "services*"
]
exclude = [
    "apps*",
    "data*",
    "docs*",
    "templates*",
    "experiments*",
    "tests*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
